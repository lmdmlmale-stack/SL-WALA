<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Photos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="photos">

  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/"><span class="dot"></span> Gallery</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/videos">Videos</a>
        <a href="/photos">Photos</a>

      <div class="search">
        <input type="search" id="page-search" placeholder="Search photos…" aria-label="Search photos">

  <main class="container">
    <div class="page-head">

  <footer class="site-footer">
    Local media gallery &middot; All content stored on this machine
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/gallery.js"></script>
